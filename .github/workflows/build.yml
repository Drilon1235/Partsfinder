# Tests on every push; the Windows installer on a version tag (v0.2.0) or by hand (Actions > Build > Run workflow).
# A tag also makes a draft GitHub Release with the installer: check it, then publish it on GitHub.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Python packages (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt
      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: App packages
        working-directory: app
        run: npm ci
      - name: End-to-end test (app from the source)
        working-directory: app
        env:
          PARTSFINDER_PYTHON: python
        run: xvfb-run -a npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure
          path: app/test-results/

  windows:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Get-Content app/package.json | ConvertFrom-Json).version
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} but app/package.json says $v" }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Python packages (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt -r packaging/requirements.txt
      - name: Bundle the search engine
        run: pyinstaller --noconfirm --distpath dist --workpath build/pyinstaller packaging/partsfinder-backend.spec
      - name: Bundle the embedding model
        run: python packaging/fetch_model.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build the installer
        working-directory: app
        run: |
          npm ci
          npx electron-builder --win --publish never
      - name: End-to-end test (the installed app with its own search engine)
        working-directory: app
        run: node test/e2e.js --packaged ../dist/app/win-unpacked/Partsfinder.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Partsfinder-Setup
          path: dist/app/Partsfinder-Setup-*.exe
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-windows
          path: app/test-results/
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A draft release the maintainer prepared (notes, data packs) gets the tested installer and is published.
          # Otherwise the release is made here: the notes of .github/release-notes.md, the installer, and the data
          # packs of the previous release (they only change when a pack is rebuilt), and it is published.
          $tag = "${{ github.ref_name }}"
          $exe = Get-ChildItem dist/app/Partsfinder-Setup-*.exe | Select-Object -First 1
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          $row = "| $($exe.Name) / Partsfinder-Setup.exe | ``$sha`` |"
          Copy-Item $exe.FullName Partsfinder-Setup.exe
          $tags = gh release list --limit 100 --json tagName --jq '.[].tagName'
          if ($tags -contains $tag) {
            gh release upload $tag $exe.FullName Partsfinder-Setup.exe --clobber
            $body = (gh release view $tag --json body --jq .body) -join "`n"
          } else {
            $previous = gh release list --limit 20 --json tagName --jq '.[].tagName' | Where-Object { $_ -ne $tag } | Select-Object -First 1
            New-Item -ItemType Directory packs | Out-Null
            if ($previous) { gh release download $previous -p 'partsfinder-pack-*.zip' -D packs }
            $body = Get-Content .github/release-notes.md -Raw
            gh release create $tag $exe.FullName Partsfinder-Setup.exe (Get-ChildItem packs/*.zip | ForEach-Object FullName) --draft --title "Partsfinder $tag" --notes "..."
          }
          $body = $body -replace '(?m)^.*<!-- installer -->.*$', $row
          Set-Content -Path notes.md -Value $body -Encoding utf8
          gh release edit $tag --notes-file notes.md --draft=false --latest
