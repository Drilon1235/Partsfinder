# The download button in the README points to releases/latest/download/Partsfinder-Setup.exe: a name without the
# version, so the link never changes. After a release build this adds the tested installer under that name too.
name: Download link

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v0.2.0)
        required: true

permissions:
  contents: write

jobs:
  stable-name:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    steps:
      - name: Installer also as Partsfinder-Setup.exe
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p 'Partsfinder-Setup-*.exe' -D dl
          cp dl/Partsfinder-Setup-*.exe Partsfinder-Setup.exe
          gh release upload "$TAG" Partsfinder-Setup.exe -R "$GITHUB_REPOSITORY" --clobber
          echo "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/Partsfinder-Setup.exe"
