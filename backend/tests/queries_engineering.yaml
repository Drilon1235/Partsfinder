# Engineering test questions: how a mechanical engineer actually asks (see docs/06_TESTPLAN.md).
# Run against the real library after importing data/global/engineering and the standard parts:
#     python eval_engineering.py [--verbose]
#
# Per question:
#   q        the question, in engineer language (designation, standard, size, grade)
#   ids      the first result must be one of these ids (exact part)
#   name_has the first result's name must contain all of these (if no ids, or as alternative)
#   status   expected overall status: found (a part meets every requirement), partial (only
#            close matches with stated deviations), none (nothing usable)
#   deviation  for partial: this spec must be reported as deviating in the first result
# A wrong-spec part as "fits" is counted as a hard error ("false fit").

