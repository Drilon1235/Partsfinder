# 50 test questions for the evaluation (phase 8). See docs/06_TESTPLAN.md.
#
# Per question:
#   q          the question
#   group      clear | vague | requirements | none | separation
#   company    (optional) search as this company
#   filters    (optional) hard requirements, as another program would send them
# What is correct (the first result must meet this):
#   ids        one of these ids
#   category   category starts with this
#   material   material contains this text
#   company_top  the result comes from this company library
#   status     none = nothing may be proposed
# Every question also checks that nothing of another company is among the results.

